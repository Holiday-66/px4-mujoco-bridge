name: Python tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tested runtime and development dependencies
        run: python -m pip install -c requirements-tested.txt -e '.[test]'
      - name: Headless unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Source hygiene and release-marker check
        run: python scripts/check_release.py --ready
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check installed wheel contains its model
        run: |
          python -m pip install --force-reinstall --no-deps dist/px4_mujoco_bridge-*.whl
          cd /tmp
          python -c 'from px4_mujoco_bridge.model import Aircraft; assert Aircraft().model.nu == 4'
          px4-mujoco --version
