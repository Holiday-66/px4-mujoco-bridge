[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "px4-mujoco-bridge"
version = "0.1.0"
description = "A local Simulator MAVLink bridge between stock PX4 SITL and MuJoCo"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["mujoco>=3.4,<4", "numpy>=1.26,<3", "pymavlink>=2.4.49,<3"]

[project.urls]
Repository = "https://github.com/Holiday-66/px4-mujoco-bridge"
Documentation = "https://github.com/Holiday-66/px4-mujoco-bridge/blob/main/docs/setup.md"
Issues = "https://github.com/Holiday-66/px4-mujoco-bridge/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
px4-mujoco = "px4_mujoco_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
px4_mujoco_bridge = ["models/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
